<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Marlowe Job — a museum heist in three rooms</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div class="hud" id="hud-top">
      <div class="cell">
        <span id="hud-room">I — THE MARLOWE GALLERY</span>
        <span id="hud-room-sub">THE MARLOWE JOB</span>
      </div>
      <div class="cell center">
        <span id="hud-loot">$0</span>
        <span><span id="hud-loot-total">of $124,000</span> &nbsp;·&nbsp; TIME <span id="hud-time">0:00</span></span>
      </div>
      <div class="cell center">
        <span id="hud-alarm-label">ALARM</span>
        <span id="hud-alarm-bar"><span id="hud-alarm-fill"></span></span>
        <span id="hud-alarm-pct">0%</span>
      </div>
      <div class="cell right">
        <span id="hud-objective">OBJECTIVE: STEAL THE STAR</span>
        <span id="hud-tools"><span id="hud-lives">♥♥♥</span> &nbsp; <span id="hud-smoke">SMOKE ×3</span> &nbsp; <span id="hud-emp">EMP ×2</span></span>
      </div>
    </div>
    <div id="hud-toast"></div>
    <div class="hud" id="hud-bottom">
      <span id="hud-hint">WASD MOVE &nbsp;·&nbsp; SHIFT SNEAK &nbsp;·&nbsp; E GRAB / USE &nbsp;·&nbsp; Q OR CLICK SMOKE &nbsp;·&nbsp; R EMP &nbsp;·&nbsp; P PAUSE</span>
    </div>
  </div>
  <script type="module" src="src/boot.js"></script>
</body>
</html>
